<style>
/* Layout: cartão vertical na proporção da capa; a capa abre como livro e revela o interior. Identidade Academia da Noiva: Noto Serif condensada e fina, Montserrat leve, monograma e lettering em dourado, paleta creme/dourado/oliva. */
:root {
  --paper: #FFFEFB;
  --linen: #F6E7D0;
  --sand: #DEC7A3;
  --gold: #AD8821;
  --olive: #60682E;
  --ink: #3E4036;
  --ink-soft: #77786C;
  --stage: #F4EEE3;
  --display: "Noto Serif Display", "Noto Serif", "Times New Roman", serif;
  --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { min-height: 100%; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}
.hint {
  font-family: var(--sans);
  font-weight: 400;
  letter-spacing: .3em;
  text-transform: uppercase;
  font-size: 10px;
  color: var(--ink-soft);
  text-align: center;
  margin: 0;
  min-height: 1.4em;
  transition: opacity .6s;
}
.stage { position: relative; width: min(100%, 440px); max-width: 100%; perspective: 1800px; }

/* ---------- Interior ---------- */
.inside {
  position: relative;
  aspect-ratio: 591 / 1048;
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(62,64,54,.08), 0 22px 44px -22px rgba(62,64,54,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 14% 11%;
}
.inside::before {
  content: ""; position: absolute; inset: 16px;
  border: .5px solid var(--sand);
  pointer-events: none;
}
.inside > * { position: relative; opacity: 0; transform: translateY(8px); transition: opacity 1s ease, transform 1s ease; }
.open .inside > * { opacity: 1; transform: none; }
.open .inside > *:nth-child(1) { transition-delay: .6s }
.open .inside > *:nth-child(2) { transition-delay: .75s }
.open .inside > *:nth-child(3) { transition-delay: .9s }
.open .inside > *:nth-child(4) { transition-delay: 1.05s }
.open .inside > *:nth-child(5) { transition-delay: 1.2s }
.open .inside > *:nth-child(6) { transition-delay: 1.35s }
.open .inside > *:nth-child(7) { transition-delay: 1.5s }
.open .inside > *:nth-child(8) { transition-delay: 1.65s }

.mono { width: 22%; max-width: 92px; height: auto; display: block; }
.eyebrow {
  font-family: var(--display); font-stretch: 70%; font-weight: 300;
  text-transform: uppercase; letter-spacing: .22em;
  font-size: clamp(15px, 4.6vw, 19px);
  color: var(--ink); margin: 0 0 .2em;
}
.names { width: 92%; height: auto; display: block; margin: .6em 0 0; }
.line { width: 46%; height: 0; border-top: .5px solid var(--sand); margin: 1.6em 0; }

.date {
  font-family: var(--display); font-stretch: 65%; font-weight: 300;
  font-size: clamp(42px, 13.5vw, 60px); line-height: 1;
  letter-spacing: .04em; color: var(--ink);
  display: flex; align-items: baseline; justify-content: center; gap: .28em;
  font-variant-numeric: lining-nums;
  margin: 0;
}
.date i { font-style: normal; color: var(--gold); font-size: .5em; transform: translateY(-.35em); }
.meta {
  font-family: var(--sans); font-weight: 400;
  text-transform: uppercase; letter-spacing: .26em;
  font-size: clamp(10px, 2.9vw, 12px); line-height: 2;
  color: var(--ink-soft); margin: 1em 0 0;
}
.meta b { font-weight: 500; color: var(--olive); }

.countdown { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; margin-top: 1.8em; }
.countdown div { display: flex; flex-direction: column; gap: 4px; padding-block: 2px; }
.countdown div + div { border-left: .5px solid var(--sand); }
.countdown b {
  font-family: var(--display); font-stretch: 65%; font-weight: 300;
  font-size: clamp(26px, 8vw, 34px); line-height: 1; color: var(--gold);
  font-variant-numeric: tabular-nums lining-nums;
}
.countdown small { font-family: var(--sans); font-weight: 400; text-transform: uppercase; letter-spacing: .2em; font-size: 9px; color: var(--ink-soft); }

.actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 2em; }
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans); font-weight: 500;
  text-transform: uppercase; letter-spacing: .24em; font-size: 10.5px;
  color: var(--paper); background: var(--olive);
  text-decoration: none; padding: 1.15em 2em;
  transition: background .25s, transform .25s;
}
.btn:hover { background: #4E5525; transform: translateY(-1px); }
.btn svg { width: 14px; height: 14px; flex: none; }
.btn:focus-visible, .linkish:focus-visible, .seal-hit:focus-visible { outline: 1px solid var(--olive); outline-offset: 4px; }
.note { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 15px; color: var(--ink-soft); margin: 0; }
.linkish {
  background: none; border: 0; cursor: pointer; padding: 6px;
  font-family: var(--sans); font-weight: 400; text-transform: uppercase; letter-spacing: .24em; font-size: 9.5px;
  color: var(--ink-soft); text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--sand);
}

/* ---------- Capa ---------- */
.cover {
  position: absolute; top: 0; left: 0; width: 100%; aspect-ratio: 591 / 1048;
  transform-origin: left center; transform-style: preserve-3d;
  transition: transform 1.6s cubic-bezier(.6,.05,.25,1), opacity .5s ease 1.2s;
  z-index: 2; cursor: pointer;
  box-shadow: 0 1px 2px rgba(62,64,54,.1), 0 22px 44px -22px rgba(62,64,54,.4);
}
.cover > img { width: 100%; height: 100%; display: block; object-fit: cover; backface-visibility: hidden; user-select: none; -webkit-user-drag: none; }
.open .cover { transform: rotateY(-115deg); opacity: 0; pointer-events: none; }
.seal-hit {
  position: absolute; left: 84.1%; top: 43.4%; width: 18%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 0; background: transparent; cursor: pointer; z-index: 3;
}
.seal-hit::before, .seal-hit::after {
  content: ""; position: absolute; inset: 4%; border-radius: 50%;
  border: 1px solid rgba(173,136,33,.85);
  animation: pulse 2.6s ease-out infinite;
}
.seal-hit::after { animation-delay: 1.3s; }
@keyframes pulse { 0% { transform: scale(.9); opacity: .9 } 100% { transform: scale(1.6); opacity: 0 } }
.seal-shine { position: absolute; left: 84.1%; top: 43.4%; width: 15.5%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; z-index: 3; overflow: hidden; }
.seal-shine::before { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,248,228,.5) 50%, transparent 60%); animation: shine 3.8s ease-in-out infinite; }
@keyframes shine { 0%, 55% { transform: translateX(-60%) } 100% { transform: translateX(60%) } }

@media (prefers-reduced-motion: reduce) {
  .cover { transition: opacity .4s; }
  .open .cover { transform: none; }
  .seal-hit::before, .seal-hit::after, .seal-shine::before { animation: none; }
  .inside > * { transition: opacity .4s; transform: none; }
  .open .inside > * { transition-delay: 0s !important; }
}
</style>

<script>
(function () {
  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  function open() { stage.classList.add('open'); hint.style.opacity = '0'; }
  function close() {
    stage.classList.remove('open'); hint.style.opacity = '1';
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
  }
  document.getElementById('seal').addEventListener('click', function (e) { e.stopPropagation(); open(); });
  document.getElementById('cover').addEventListener('click', open);
  document.getElementById('close').addEventListener('click', close);

  // Contagem até 18/09/2027, 16h30 em São Paulo (UTC-3)
  var target = Date.UTC(2027, 8, 18, 19, 30, 0);
  var els = ['d', 'h', 'm', 's'].map(function (k) { return document.getElementById('cd-' + k); });
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var s = Math.floor(Math.max(0, target - Date.now()) / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    els[0].textContent = d; els[1].textContent = pad(h); els[2].textContent = pad(m); els[3].textContent = pad(s);
  }
  tick(); setInterval(tick, 1000);
})();
</script>
